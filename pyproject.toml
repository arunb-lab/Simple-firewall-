[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-firewall"
version = "1.0.0"
description = "A rule-based firewall simulator for learning how packet filtering decisions are made"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["firewall", "networking", "security", "education", "simulation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
firewall = "firewall.cli:main"

[tool.setuptools]
packages = ["firewall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The README's code samples use deliberate comment alignment; leave them alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
